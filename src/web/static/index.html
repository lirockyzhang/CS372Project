<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaToe — Play</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main>
  <header>
    <h1>AlphaToe</h1>
    <p class="subtitle">Play Ultimate Tic-Tac-Toe against a trained agent.</p>
  </header>

  <section class="layout">
    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="status" class="status">Loading…</div>
    </div>

    <aside class="panel">
      <div class="panel-row">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>

      <div class="panel-row">
        <label>Play as</label>
        <div class="seg" id="play-as">
          <button data-side="X" class="active">X (first)</button>
          <button data-side="O">O</button>
        </div>
      </div>

      <div class="panel-row">
        <label for="sims">Simulations: <span id="sims-val">200</span></label>
        <input type="range" id="sims" min="10" max="800" step="10" value="200">
      </div>

      <div class="panel-row">
        <label class="check"><input type="checkbox" id="show-heatmap" checked> Show policy heatmap</label>
      </div>

      <button id="new-game" class="primary">New Game</button>

      <div class="introspect">
        <h3>AI's last move</h3>
        <div id="value-bar-wrap">
          <div class="value-label"><span>O wins</span><span id="value-num">—</span><span>X wins</span></div>
          <div class="value-bar"><div id="value-fill"></div></div>
        </div>
        <ol id="top-moves"></ol>
        <div id="elapsed" class="elapsed"></div>
      </div>
    </aside>
  </section>

  <footer>
    <p>Stateless server — board state lives in the browser.</p>
  </footer>
</main>

<script src="/static/app.js"></script>
</body>
</html>
